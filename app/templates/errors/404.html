{% extends "base.html" %}
{% block title %}404 - No Encontrado{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="card tarjeta_caracteristica shadow-sm p-5">
                <div class="display-1 mb-4">🔍</div>
                <h1 class="fw-bold text-main mb-3">Página No Encontrada</h1>
                <p class="text-secondary mb-4">La página que buscás no existe o fue movida.</p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Ir al Inicio</a>
                    <button onclick="history.back()" class="btn btn-outline-custom">Volver</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
